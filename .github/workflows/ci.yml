name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Syntax check
        run: node --check index.mjs
      - name: Run the action on the fixture
        id: versyka
        uses: ./
        with:
          path: test/fixture
          comment: "false"
          fail-on: none
      - name: It found exactly the two retired calls
        # app.py: gpt-3.5-turbo (OpenAI). bedrock.py: a Bedrock ID with Bedrock's own date (v1.1.0).
        # notes.py names GPT-4-0613 in a comment, which is prose and must not count (v1.1.1).
        run: |
          echo "retired=${{ steps.versyka.outputs.retired }}"
          test "${{ steps.versyka.outputs.retired }}" -eq 2
